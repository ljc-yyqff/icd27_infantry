enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 2 # degree -2.5
pitch_offset: 6.5 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: false # 首次串口联调必须保持false；完成方向、限位和急停验证后再开启

camera_name: "daheng"
exposure_ms: 10.0
gain: 12
white_balance_auto: "Once"
swap_rb: true
rotate_180: false
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 原始标定重投影误差: 0.2375px。当前输出原始正向画面（3088x2064），内参及切向畸变已同步还原。
camera_matrix: [2493.8093629470959, 0, 1558.8111903777171, 0, 2493.4350742530842, 1111.8619667378632, 0, 0, 1]
distort_coeffs: [-0.070545088343562434, 0.10490865143132844, -0.0010693998768263142, 0.00050128827408037224, 0]

# 相机同理想情况的偏角: yaw1.44 pitch-7.28 roll0.96 degree
# 标定板到世界坐标系原点的水平距离: 1.13 m
# 标定板同竖直摆放时的偏角: yaw7.61 pitch13.92 roll-0.46 degree
R_camera2gimbal: [-0.027182119030230909, -0.12616154330853446, 0.99163723074269183, -0.99949106557517331, 0.019998323121329122, -0.024853106601381177, -0.016695575474690555, -0.99180811252093692, -0.12664093215554434]
t_camera2gimbal: [0.13160669975045827, 0.10377721766577375, 0.024908271912914642]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
baudrate: 115200
serial_timeout_ms: 20
serial_reconnect_error_count: 50
serial_offline_timeout_ms: 100 # 超时未收到A板合法反馈时，NUC强制停止控制和开火
# gimbal1 visual tracking: maximum angle allowed for one relative yr/pr command.
gimbal1_max_relative_angle_deg: 10.0
gimbal1_max_speed_deg_s: 60.0
# yaw_kp: 0
# yaw_kd: 0
# pitch_kp: 0
# pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s

# New ASCII firmware: 9-column telemetry at 50 Hz; #GM status and #GC receipts.
gimbal1_yaw_direction: -1
gimbal1_pitch_direction: -1

# Single held armor: two-axis IMU compensation + original PnP/EKF + target velocity feedforward.
# Host receive/dequeue timestamps are not hardware timestamps. Positive latencies are subtracted.
gimbal1_tracking:
  command_rate_cap_hz: 25.0 # reserve telemetry slots: #GC replies replace feedback in current firmware
  imu_yaw_sign: 1.0
  imu_pitch_sign: -1.0 # x-forward/y-left/z-up rotation; verify on fixed-base bench
  imu_latency_ms: 0.0 # unknown until measured
  camera_latency_ms: 0.0 # unknown until measured; includes dequeue vs exposure offset
  pose_max_gap_ms: 80.0
  pose_extrapolate_ms: 50.0
  additional_prediction_ms: 0.0 # extra actuator/transport delay, NOT a measured value
  max_prediction_ms: 150.0
  max_reprojection_px: 4.0 # floor; also allow a bounded fraction of lightbar image height
  max_reprojection_fraction: 0.04
  max_reprojection_absolute_px: 20.0
  max_lead_deg: 2.0
  max_feedforward_deg_s: 30.0
  feedforward_velocity_tau_ms: 50.0 # smooth only the model feedforward, never delay the pixel base
  max_range_m: 30.0
  acceleration_sigma_m_s2: 20.0
  measurement_sigma_xy_m: 0.001
  measurement_sigma_depth_m: 0.06
  min_motion_samples: 5
  feedforward_gain: 0.8
  feedforward_deadband_deg_s: 0.5
